<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DRONEFALL PV</title>
<style>
@font-face { font-family: Mincho; src: url(assets/fonts/mincho-r.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Mincho; src: url(assets/fonts/mincho-m.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Mincho; src: url(assets/fonts/mincho-sb.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: Corm; src: url(assets/fonts/cormorant.woff2) format('woff2'); font-weight: 300 700; }
@font-face { font-family: Corm; src: url(assets/fonts/cormorant-i.woff2) format('woff2'); font-weight: 300 700; font-style: italic; }
@font-face { font-family: Jost; src: url(assets/fonts/jost.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Jost; src: url(assets/fonts/jost-i.woff2) format('woff2'); font-weight: 100 900; font-style: italic; }

:root {
  --OR: #F28322; --OR2: #FFA552; --ORD: #C2560F;
  --R: #C8202D; --R2: #FF3B4B; --RD: #5e0c14;
  --P: #e3e3df; --C: #1b1c1f;
}
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
.scene { position: absolute; inset: 0; overflow: hidden; color: var(--fg); font-family: Mincho, serif; }
.bgwrap { position: absolute; inset: 0; }
.content { position: absolute; inset: 0; transform-origin: 50% 50%; }
.layer { position: absolute; inset: -60px; background-size: cover; background-position: center; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
#grain { background-size: 1920px 1080px; mix-blend-mode: overlay; }
#vig { background: url(assets/tex/vignette.png) center/cover; }
#flash { opacity: 0; }
#fade { background: #000; opacity: 0; }
#glitch i { position: absolute; display: none; }

/* colour context per background (player = orange/gray, enemy = red) */
.bg-black, .bg-char, .bg-grid, .bg-split, .bg-split2, .bg-split3, .bg-band2 { --fg: #e9e9e6; --fg2: #9a9ca0; --ac: var(--OR); --line: rgba(233,233,230,.45); }
.bg-dred, .bg-band { --fg: #f4dadc; --fg2: #b07a7f; --ac: var(--R2); --line: rgba(255,80,90,.45); }
.bg-paper { --fg: #222326; --fg2: #626468; --ac: #DD6416; --line: rgba(34,35,38,.45); }
.bg-orange { --fg: #1c1d20; --fg2: rgba(28,29,32,.72); --ac: #fff6ec; --line: rgba(28,29,32,.5); }
.bg-gray { --fg: #f2f2ef; --fg2: #d0d2d5; --ac: var(--OR2); --line: rgba(242,242,239,.45); }
.bg-red, .bg-versus { --fg: #fff3f3; --fg2: rgba(255,236,236,.78); --ac: #2a080b; --line: rgba(255,240,240,.45); }
.enemy.bg-paper { --ac: var(--R); }
.enemy.bg-black, .enemy.bg-char, .enemy.bg-grid, .enemy.bg-band2 { --ac: var(--R2); --line: rgba(255,80,90,.45); }
/* text living on the light part of split backgrounds */
.lt { --fg: #222326; --fg2: #626468; --line: rgba(34,35,38,.45); color: var(--fg); }
.enemy .lt { --ac: var(--R); }
.bg-split .lt, .bg-split2 .lt, .bg-split3 .lt, .bg-band2 .lt { --ac: #DD6416; }
.enemy.bg-split .lt, .enemy.bg-split2 .lt, .enemy.bg-split3 .lt, .enemy.bg-band2 .lt { --ac: var(--R); }

.abs { position: absolute; }
.c { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.v { writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap; }
.ch { display: inline; }
.kw { font-family: Mincho, serif; font-weight: 500; }
.mc { font-family: Mincho, serif; font-weight: 400; }
.en { font-family: Corm, Mincho, serif; font-weight: 500; }
.lb { font-family: Jost, Mincho, sans-serif; font-weight: 500; text-transform: uppercase; }
.num { font-family: Corm, Mincho, serif; font-weight: 500; }
.ac { color: var(--ac); }
.or { color: var(--OR); }
.r { color: var(--R); }
.r2 { color: var(--R2); }
.fg2 { color: var(--fg2); }
.tag { font-family: Corm, Mincho, serif; font-weight: 600; font-size: 25px; letter-spacing: .16em; color: var(--fg); }
.body { font-family: Mincho, serif; font-weight: 400; font-size: 19px; line-height: 2.15; letter-spacing: .1em; color: var(--fg2); text-align: justify; }
.vbody { writing-mode: vertical-rl; font-family: Mincho, serif; font-weight: 400; font-size: 20px; line-height: 2.25; letter-spacing: .14em; color: var(--fg2); white-space: normal; }
.quote { font-family: Mincho, serif; font-weight: 400; letter-spacing: .16em; }
.epi { font-family: Jost, sans-serif; font-style: italic; font-weight: 400; font-size: 16px; letter-spacing: .06em; color: var(--fg2); }
.subkw { font-family: Jost, sans-serif; font-weight: 600; font-size: 19px; letter-spacing: .3em; color: var(--ac); }
.hl { width: 100%; height: 1.5px; background: var(--line); transform-origin: 0 50%; }
.vl { width: 1.5px; background: var(--line); transform-origin: 50% 0; }
.ico { display: block; overflow: visible; }
.outline { color: transparent; -webkit-text-stroke: 1.5px var(--ac); }
.pill { display: inline-block; padding: 8px 22px 8px 18px; font-family: Jost, Mincho, sans-serif; font-weight: 500; letter-spacing: .2em; font-size: 22px; }
.tile { border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.corner { position: absolute; font-family: Jost, Mincho, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: .32em; color: var(--fg2); }

</style>
</head>
<body>
<div id="stage">
  <div id="scene" class="scene"></div>
  <div id="glitch" class="overlay"></div>
  <div id="vig" class="overlay"></div>
  <div id="grain" class="overlay"></div>
  <div id="flash" class="overlay"></div>
  <div id="fade" class="overlay"></div>
</div>
<script src="assets/icons.js"></script>
<script src="engine.js"></script>
<script src="emblems.js"></script>
<script src="terms.js"></script>
<script src="scenes.js"></script>
<script>
  // preview: index.html?t=12.5 renders that time
  const q = new URLSearchParams(location.search);
  window.PV_READY = (async () => {
    await document.fonts.ready;
    const imgs = ['grunge_light', 'grunge_dark', 'map_dark', 'map_light', 'mosaic', 'vignette', 'grain0', 'grain1', 'grain2', 'grain3', 'grain4', 'grain5'];
    await Promise.all(imgs.map((n) => { const im = new Image(); im.src = `assets/tex/${n}.png`; return im.decode().catch(() => {}); }));
    // warm every face so the first frame that uses one is not drawn with a fallback
    await Promise.all(['400 40px Mincho', '500 40px Mincho', '600 40px Mincho', '500 40px Corm', 'italic 500 40px Corm', '500 40px Jost', 'italic 400 40px Jost']
      .map((f) => document.fonts.load(f, '機械A■')));
    if (q.has('t')) renderAt(parseFloat(q.get('t')));
    return true;
  })();
</script>
</body>
</html>
